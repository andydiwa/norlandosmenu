<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2a49">
<meta charset="utf-8">
<title>Norlando's Digital Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Montserrat:wght@400;500;600;700&family=Poppins:wght@400&display=swap">
<style>
/* Layout: Photo-tile dashboard with search (3/4/6 columns by width) → category page with a sticky brand bar, hero photo, tabs on phone/tablet, sidebar on desktop, tap-a-dish cards. Single brand look (Norlando's navy + tan). */
:root{
  color-scheme: dark;
  --ground:#1f2f50;
  --navy:#26385e;
  --navy-deep:#1c2a49;
  --tan:#d3b28f;
  --tan-hi:#e3c6a6;
  --cream:#ece2c6;
  --gold:#e9b949;
  --ink:#ffffff;
  --muted:rgba(255,255,255,.75);
  --card:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.12);
  --coffee:#3a1d14;
  --f-ui:'Montserrat',system-ui,sans-serif;
  --f-name:'Barlow','Montserrat',system-ui,sans-serif;
  --f-body:'Poppins','Montserrat',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
html{background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
.logo-svg svg{display:block;width:100%;height:auto}

/* ---------- Dashboard ---------- */
#home{padding-block:28px 24px;display:flex;flex-direction:column;gap:16px;min-height:100vh;min-height:100dvh;box-sizing:border-box}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;animation:fadeDown .6s var(--ease) both}
.top .logo-svg{width:clamp(130px,22vw,190px)}
.status{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;color:var(--cream);text-align:right}
.status b{display:flex;align-items:center;gap:6px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#7fd18b;animation:pulse 2s infinite}
.dot.closed{background:#e07a6a;animation:none}
.search{position:relative;display:flex;align-items:center;animation:fadeUp .6s var(--ease) both .1s}
.search svg.mag{position:absolute;left:14px;width:18px;height:18px;stroke:var(--tan);pointer-events:none}
.search input{width:100%;box-sizing:border-box;height:48px;border-radius:999px;border:1.5px solid rgba(211,178,143,.45);background:rgba(255,255,255,.06);padding:0 44px 0 42px;font-size:15px;color:#fff;outline:none;transition:border-color .2s,background .2s;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:rgba(236,226,198,.6)}
.search input:focus{border-color:var(--tan);background:rgba(255,255,255,.1)}
.search input::-webkit-search-cancel-button{display:none}
.clr{position:absolute;right:6px;width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--cream);cursor:pointer;display:grid;place-items:center}
.clr:hover{background:rgba(255,255,255,.08)}
.clr svg{width:16px;height:16px}
.label{font:600 13px var(--f-name);letter-spacing:.12em;text-transform:uppercase;color:var(--tan);margin:6px 0 0}
#browse{display:flex;flex-direction:column;gap:16px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{appearance:none;border:0;padding:0;position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;cursor:pointer;background:var(--navy);display:flex;align-items:flex-end;
  animation:tileIn .55s var(--ease) both;animation-delay:calc(var(--i)*45ms + 150ms);transition:transform .25s var(--ease),box-shadow .25s}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,30,52,0) 40%,rgba(20,30,52,.85) 100%)}
.tile span{position:relative;z-index:1;display:block;width:100%;padding:9px 10px;text-align:left;font-weight:600;font-size:clamp(12.5px,1.6vw,15px);line-height:1.15}
.tile.icon{background:var(--tan);color:var(--navy-deep)}
.tile.icon::after{display:none}
.tile.icon svg{position:absolute;top:22%;left:50%;width:38%;height:auto;transform:translateX(-50%);stroke:var(--navy)}
.tile.coffee{background:var(--coffee)}
.tile.coffee img{object-fit:contain;padding:10%;box-sizing:border-box}
.tile:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(0,0,0,.3)}
.tile:hover img{transform:scale(1.08)}
.tile:active{transform:scale(.97)}
.feasts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.feast{aspect-ratio:4/3.4}
.feast span{padding:12px}
.feast b{display:block;font-size:clamp(15px,2vw,22px)}
.feast small{display:block;font-weight:500;font-size:clamp(11px,1.3vw,13px);color:var(--cream);margin-top:2px}
#results{display:flex;flex-direction:column;gap:12px}
.rcount{margin:2px 0 0;font-size:13px;color:var(--cream)}
.empty{padding:28px 16px;text-align:center;color:var(--cream);font-size:14px;line-height:1.5;background:var(--card);border-radius:16px}
.incat{appearance:none;align-self:flex-start;border:0;background:transparent;padding:4px 0 0;font-size:12px;font-weight:600;color:var(--tan);cursor:pointer}
.incat:hover{color:var(--tan-hi);text-decoration:underline}
.foot{margin-top:auto;padding-top:24px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;font-size:13px;color:var(--cream);animation:fadeUp .6s var(--ease) both .8s}
.foot .num{user-select:all}
.social{display:flex;justify-content:center;align-items:center;gap:14px}
.social a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--cream);background:rgba(255,255,255,.08);transition:background .2s,color .2s,transform .2s}
.social a:hover{background:var(--tan);color:var(--navy-deep);transform:translateY(-2px)}
.social svg{width:22px;height:22px}
.handle b{color:#fff}
.hrs{opacity:.9;line-height:1.55}
.addr{max-width:34ch;line-height:1.5;display:flex;flex-direction:column;align-items:center;gap:8px}
.addr .pin{width:22px;height:22px;stroke:var(--tan)}
.dir{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;background:var(--tan);color:var(--navy-deep);font-weight:600;font-size:13px;text-decoration:none;transition:background .2s,transform .2s}
.dir:hover{background:var(--tan-hi);transform:translateY(-2px)}
.dir svg{width:16px;height:16px}

/* ---------- Category page ---------- */
#cat{min-height:100vh;min-height:100dvh}
.brandbar{position:sticky;top:0;z-index:6;background:var(--navy-deep);border-bottom:2px solid var(--tan)}
.brandbar .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;height:60px}
.brandbar .logo-svg{width:96px;cursor:pointer}
.back{appearance:none;border:0;justify-self:start;height:40px;padding:0 14px 0 8px;border-radius:999px;background:var(--tan);color:var(--navy-deep);display:flex;align-items:center;gap:4px;cursor:pointer;font-weight:600;font-size:13px;transition:transform .2s,background .2s}
.back:hover{transform:translateX(-3px);background:var(--tan-hi)}
.back svg{width:18px;height:18px}
.bb-right{justify-self:end;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;color:var(--cream)}
.bb-right span{display:flex;align-items:center;gap:6px}
.sbtn{appearance:none;border:0;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);color:var(--cream);display:grid;place-items:center;cursor:pointer}
.sbtn:hover{background:rgba(255,255,255,.16)}
.sbtn svg{width:18px;height:18px}
.hero{position:relative;height:260px;overflow:hidden;background:var(--navy)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:heroZoom 1.2s var(--ease) both}
.hero.coffee{background:var(--coffee)}
.hero.coffee img{object-fit:contain;padding:20px 0 60px;box-sizing:border-box;animation:spin 1.1s var(--ease) both}
.hero.plain{background:var(--tan)}
.hero.plain svg{position:absolute;right:8%;top:50%;width:150px;height:150px;transform:translateY(-55%);stroke:var(--navy);opacity:.9}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,30,52,0) 45%,rgba(20,30,52,.9) 100%)}
.hero .title{position:absolute;z-index:2;left:0;right:0;bottom:34px;animation:fadeUp .6s var(--ease) both .15s}
.hero h1{margin:0;font:600 clamp(34px,6vw,52px)/1 var(--f-name);text-wrap:balance}
.hero p{margin:6px 0 0;font-size:13px;color:var(--cream)}
.sheet{position:relative;z-index:3;margin-top:-20px;background:var(--ground);border-radius:22px 22px 0 0}
.layout{display:block;padding-block:6px 40px}
.tabs{position:sticky;top:62px;z-index:4;background:var(--ground);display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:14px;padding-top:10px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:transparent;flex:none;padding:8px 0 10px;font-size:13px;font-weight:600;color:rgba(236,226,198,.6);border-bottom:3px solid transparent;cursor:pointer;transition:color .2s,border-color .25s}
.tab[aria-current="true"]{color:#fff;border-color:var(--tan)}
.side{display:none}
.hint{margin:0 0 12px;font-size:12px;color:rgba(236,226,198,.7)}
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
.card{box-sizing:border-box;cursor:pointer;background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;
  animation:cardIn .5s var(--ease) both;animation-delay:calc(var(--i)*50ms + 150ms);transition:background .25s}
.card:hover{background:rgba(255,255,255,.09)}
.card.out{opacity:.55}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navy-deep);background:var(--gold);padding:2px 8px;border-radius:999px}
.badge svg{width:10px;height:10px}
.badge.so{background:#e07a6a;color:#fff}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.name{appearance:none;border:0;background:transparent;padding:0;min-height:28px;text-align:left;cursor:pointer;font:600 19px/1.2 var(--f-name);color:#fff}
.price{flex:none;font:500 17px var(--f-name);color:var(--tan-hi);font-variant-numeric:tabular-nums}
.desc{margin:0;font:400 12.5px/1.55 var(--f-body);color:var(--muted)}
.desc ul{margin:2px 0 0;padding-left:18px}
.note{margin:0;font-size:11.5px;color:var(--tan-hi)}
.ph{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.card.open .ph{grid-template-rows:1fr}
.ph>div{overflow:hidden;min-height:0}
.ph img,.ph .soon{display:block;width:100%;aspect-ratio:16/10;margin-top:8px;border-radius:12px;object-fit:cover;opacity:0;transform:scale(.96);transition:opacity .4s,transform .45s var(--ease)}
.ph img.contain{object-fit:contain;background:var(--coffee)}
.card.open .ph img,.card.open .ph .soon{opacity:1;transform:none}
.soon{box-sizing:border-box;border:1.5px dashed rgba(211,178,143,.5);display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:rgba(236,226,198,.75);font-size:12px}
.soon svg{width:30px;height:30px}
.pager{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:24px}
.pager button{appearance:none;border:1px solid rgba(211,178,143,.6);background:transparent;color:var(--cream);font-size:13px;font-weight:500;padding:11px 16px;border-radius:999px;cursor:pointer;max-width:48%;transition:background .2s}
.pager button:hover{background:rgba(211,178,143,.15)}
.pager .nx{margin-left:auto}
.pager .home-btn{flex-basis:100%;max-width:none;background:var(--tan);color:var(--navy-deep);border-color:var(--tan);font-weight:600}
.pager .home-btn:hover{background:var(--tan-hi)}

.enter-up{animation:inUp .5s var(--ease) both}
.enter-from-right{animation:inRight .45s var(--ease) both}
.enter-from-left{animation:inLeft .45s var(--ease) both}

/* ---------- Tablet ---------- */
@media (min-width:700px){
  .wrap{padding-inline:28px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .feasts{gap:12px}
  .feast{aspect-ratio:16/8}
  .hero{height:280px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .search{max-width:560px}
}
/* ---------- Desktop ---------- */
@media (min-width:1024px){
  #home{padding-block:40px 28px;gap:20px}
  .tiles{grid-template-columns:repeat(6,minmax(0,1fr))}
  .feast{aspect-ratio:16/6}
  .hero{height:320px}
  .layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;padding-top:24px}
  .tabs{display:none}
  .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:84px;align-self:start}
  .side button{appearance:none;border:0;background:transparent;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;cursor:pointer;color:var(--cream);font-size:14px;font-weight:500;text-align:left;transition:background .2s}
  .side button:hover{background:rgba(255,255,255,.06)}
  .side button[aria-current="true"]{background:var(--tan);color:var(--navy-deep);font-weight:600}
  .side .th{width:32px;height:32px;border-radius:9px;object-fit:cover;flex:none;background:var(--navy)}
  .side .th.ic{display:grid;place-items:center;background:var(--tan)}
  .side .th.ic svg{width:18px;height:18px;stroke:var(--navy)}
  .side h2{margin:0 0 8px;font:600 13px var(--f-name);letter-spacing:.12em;text-transform:uppercase;color:var(--tan)}
}

@keyframes tileIn{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes heroZoom{from{transform:scale(1.12)}to{transform:none}}
@keyframes spin{from{opacity:0;transform:rotate(-90deg) scale(.7)}to{opacity:1;transform:none}}
@keyframes inUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes inRight{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes inLeft{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(127,209,139,.6)}70%{box-shadow:0 0 0 8px rgba(127,209,139,0)}100%{box-shadow:0 0 0 0 rgba(127,209,139,0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}
</style>

<main id="home" class="wrap" aria-label="Menu">
  <header class="top">
    <div class="logo-svg" data-logo></div>
    <div class="status" id="status"></div>
  </header>
  <div class="search" role="search">
    <svg class="mag" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Search dishes, e.g. sisig or ube" aria-label="Search the menu" autocomplete="off">
    <button class="clr" id="clr" aria-label="Clear search" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div id="browse">
    <p class="label">What are you craving?</p>
    <nav class="tiles" id="tiles" aria-label="Menu categories"></nav>
    <p class="label" id="feastLabel">For the barkada</p>
    <div class="feasts" id="feasts"></div>
  </div>
  <section id="results" hidden aria-live="polite"></section>
  <footer class="foot" id="foot"></footer>
</main>

<section id="cat" hidden aria-live="polite"></section>

  extra:'<circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/>',
  plate:'<circle cx="12" cy="13" r="8"/><circle cx="12" cy="13" r="4.5"/><path d="M4 4v4M2.5 4v3a1.5 1.5 0 0 0 3 0V4M20 4c-1.5 1-2 3-2 5h2v11"/>'
};
const svgIcon = k => `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k] || ICON.plate}</svg>`;
const STAR = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg>';
const CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>';
const MAG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtPrice = p => (typeof p === 'number') ? p.toLocaleString('en-PH') : String(p || '');
const fold = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const home = document.getElementById('home'), cat = document.getElementById('cat');

document.querySelectorAll('[data-logo]').forEach(el => { el.innerHTML = LOGO_SVG; el.setAttribute('role', 'img'); el.setAttribute('aria-label', "Norlando's"); });

/* ----- Dashboard ----- */
const mainCats = CATS.filter(c => c.section !== 'Barkada'), feastCats = CATS.filter(c => c.section === 'Barkada');
document.getElementById('tiles').innerHTML = mainCats.map((c, i) => {
  if (!c.photo) return `<button class="tile icon" style="--i:${i}" data-go="${esc(c.id)}">${svgIcon(c.icon)}<span>${esc(c.name)}</span></button>`;
  return `<button class="tile${c.style === 'Coffee' ? ' coffee' : ''}" style="--i:${i}" data-go="${esc(c.id)}"><img src="${esc(c.photo)}" alt="" loading="lazy"><span>${esc(c.name)}</span></button>`;
}).join('');
document.getElementById('feasts').innerHTML = feastCats.map((c, i) =>
  `<button class="tile feast" style="--i:${i + mainCats.length}" data-go="${esc(c.id)}">${c.photo ? `<img src="${esc(c.photo)}" alt="" loading="lazy">` : ''}<span><b>${esc(c.name)}</b>${c.tile ? `<small>${esc(c.tile)}</small>` : ''}</span></button>`).join('');
document.getElementById('feastLabel').hidden = !feastCats.length;

const hoursHtml = (S.hoursDisplay || []).map(l => { const k = l.indexOf(': '); return k > 0 ? `<b>${esc(l.slice(0, k))}</b> ${esc(l.slice(k + 2))}` : esc(l); }).join('<br>');
const socials = [['tiktok','TikTok','<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.6 3c.4 2.1 1.7 3.6 3.9 3.8v3a7 7 0 0 1-3.9-1.2v6.3a5.9 5.9 0 1 1-5.9-5.9c.3 0 .6 0 .9.1v3.1a2.9 2.9 0 1 0 2 2.7V3h3z"/></svg>'],
  ['facebook','Facebook','<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-1.6 19.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.3v7A10 10 0 0 0 12 2z"/></svg>'],
  ['instagram','Instagram','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>']]
  .filter(([k]) => S[k]);
document.getElementById('foot').innerHTML = `
  ${socials.length ? `<div class="social">${socials.map(([k, label, svg]) => `<a href="${esc(S[k])}" target="_blank" rel="noopener" aria-label="Norlando's on ${label}">${svg}</a>`).join('')}</div>` : ''}
  ${S.handle ? `<span class="handle">Follow us <b>${esc(S.handle)}</b></span>` : ''}
  ${S.address ? `<div class="addr"><svg class="pin" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>${esc(S.address)}</span>
    ${S.directions ? `<a class="dir" href="${esc(S.directions)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"/></svg>Get directions</a>` : ''}</div>` : ''}
  ${S.phone ? `<span><b>Call us!</b> <span class="num">${esc(S.phone)}</span></span>` : ''}
  ${hoursHtml ? `<span class="hrs">${hoursHtml}</span>` : ''}`;

/* ----- Open / closed ----- */
function nowThere() { try { return new Date(new Date().toLocaleString('en-US', { timeZone: S.tz || 'Asia/Manila' })); } catch (e) { return new Date(); } }
function todayRange() {
  const n = nowThere(), raw = String((S.hours || [])[n.getDay()] || '').trim();
  const m = raw.match(/(\d{1,2})(?::(\d{2}))?\s*-\s*(\d{1,2})(?::(\d{2}))?/);
  if (!m) return null;
  return { from: +m[1] + (+m[2] || 0) / 60, to: +m[3] + (+m[4] || 0) / 60, n };
}
const fmtHour = x => { const h = Math.floor(x), mm = Math.round((x - h) * 60); return ((h % 12) || 12) + ':' + String(mm).padStart(2, '0') + ' ' + (h >= 12 && h < 24 ? 'PM' : 'AM'); };
function openNow() { const r = todayRange(); if (!r) return false; const h = r.n.getHours() + r.n.getMinutes() / 60; return h >= r.from && h < r.to; }
function status() {
  const r = todayRange(), el = document.getElementById('status');
  if (!S.hours || !S.hours.length) { el.innerHTML = ''; return; }
  el.innerHTML = openNow()
    ? `<b><span class="dot"></span>Open now</b><span>until ${fmtHour(r.to)}</span>`
    : `<b><span class="dot closed"></span>Closed</b>${r && r.n.getHours() < r.from ? `<span>opens ${fmtHour(r.from)}</span>` : ''}`;
}
status(); setInterval(status, 60000);

/* ----- Cards ----- */
function card(it, i, withCat) {
  const lines = String(it.desc || '').split('\n').map(s => s.trim()).filter(Boolean);
  const d = lines.length > 1 ? `<div class="desc"><ul>${lines.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : (lines.length ? `<p class="desc">${esc(lines[0])}</p>` : '');
  const isPng = /\.png(\?|$)/i.test(it.photo || '') || it.contain;
  const ph = it.photo ? `<img src="${esc(it.photo)}" alt="${esc(it.name)}" loading="lazy"${isPng ? ' class="contain"' : ''}>` : `<div class="soon">${CAM}Photo coming soon</div>`;
  const tags = (it.best ? `<span class="badge">${STAR}Bestseller</span>` : '') + (it.soldOut ? '<span class="badge so">Sold out today</span>' : '');
  return `<article class="card${it.soldOut ? ' out' : ''}" style="--i:${i}">
    ${tags ? `<div class="tags">${tags}</div>` : ''}
    <div class="row"><button class="name" aria-expanded="false">${esc(it.name)}</button><span class="price">${esc(fmtPrice(it.price))}</span></div>
    ${d}${it.note ? `<p class="note">${esc(it.note)}</p>` : ''}
    <div class="ph"><div>${ph}</div></div>
    ${withCat ? `<button class="incat" data-go="${esc(withCat.id)}">in ${esc(withCat.name)} ›</button>` : ''}
  </article>`;
}

/* ----- Uniform card sizes: every closed card in a list gets the height of the tallest ----- */
function equalize(root) {
  (root || document).querySelectorAll('.cards').forEach(list => {
    const cards = [...list.querySelectorAll('.card')];
    cards.forEach(c => { c.style.minHeight = ''; });
    let max = 0;
    cards.forEach(c => { if (!c.classList.contains('open')) max = Math.max(max, c.getBoundingClientRect().height); });
    if (max) cards.forEach(c => { c.style.minHeight = Math.ceil(max) + 'px'; });
  });
}
let eqTimer;
window.addEventListener('resize', () => { clearTimeout(eqTimer); eqTimer = setTimeout(() => equalize(), 150); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => equalize());

/* ----- Search ----- */
const q = document.getElementById('q'), clr = document.getElementById('clr'), browse = document.getElementById('browse'), results = document.getElementById('results');
const INDEX = [];
CATS.forEach(c => c.items.forEach(it => INDEX.push({ it, c, hay: fold([it.name, it.desc, it.note, c.name].join(' ')) })));
function runSearch() {
  const raw = q.value.trim(); clr.hidden = !raw;
  if (!raw) { results.hidden = true; browse.hidden = false; return; }
  const terms = fold(raw).split(/\s+/).filter(Boolean);
  const res = terms.map(t => new RegExp('(^|[^a-z0-9])' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')));
  const hits = INDEX.filter(x => res.every(r => r.test(x.hay)))
    .sort((a, b) => (fold(b.it.name).includes(terms[0]) ? 1 : 0) - (fold(a.it.name).includes(terms[0]) ? 1 : 0));
  browse.hidden = true; results.hidden = false;
  results.innerHTML = hits.length
    ? `<p class="rcount">${hits.length} ${hits.length === 1 ? 'dish matches' : 'dishes match'} “${esc(raw)}”. Tap a dish to see its photo.</p><div class="cards">${hits.map((x, i) => card(x.it, i, x.c)).join('')}</div>`
    : `<div class="empty">No dishes match “${esc(raw)}”.<br>Try “adobo”, “ube”, “spicy” or “coffee”.</div>`;
  equalize(results);
}
q.addEventListener('input', runSearch);
clr.addEventListener('click', () => { q.value = ''; runSearch(); q.focus(); });

/* ----- Category page ----- */
const sideThumb = c => c.photo ? `<img class="th" src="${esc(c.photo)}" alt="">` : `<span class="th ic">${svgIcon(c.icon)}</span>`;
let current = -1;
function show(id, dir) {
  const k = CATS.findIndex(c => c.id === id); if (k < 0) return goHome();
  const c = CATS[k], prev = CATS[k - 1], next = CATS[k + 1];
  const heroCls = c.style === 'Coffee' ? 'hero coffee' : !c.photo ? 'hero plain' : 'hero';
  const heroMedia = c.photo ? `<img src="${esc(c.photo)}" alt="">` : svgIcon(c.icon);
  const n = c.items.length;
  cat.innerHTML = `
    <div class="brandbar"><div class="wrap">
      <button class="back" data-home><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Menu</button>
      <div class="logo-svg" data-home role="img" aria-label="Norlando's">${LOGO_SVG}</div>
      <div class="bb-right">${S.hours && S.hours.length ? (openNow() ? '<span><span class="dot"></span>Open</span>' : '<span><span class="dot closed"></span>Closed</span>') : ''}<button class="sbtn" data-search aria-label="Search the menu">${MAG}</button></div>
    </div></div>
    <header class="${heroCls}">${heroMedia}
      <div class="title wrap"><h1>${esc(c.name)}</h1><p>${n} ${n === 1 ? 'item' : 'items'}${c.sub ? ' · ' + esc(c.sub) : ''}</p></div>
    </header>
    <div class="sheet"><div class="wrap layout">
      <aside class="side" aria-label="Categories"><h2>Menu</h2>${CATS.map(x => `<button data-go="${esc(x.id)}" aria-current="${x.id === id}">${sideThumb(x)}${esc(x.name)}</button>`).join('')}</aside>
      <div>
        <nav class="tabs" aria-label="Categories">${CATS.map(x => `<button class="tab" data-go="${esc(x.id)}" aria-current="${x.id === id}">${esc(x.name)}</button>`).join('')}</nav>
        <p class="hint">Tap a dish to see its photo.</p>
        <div class="cards">${c.items.map((it, i) => card(it, i)).join('')}</div>
        <div class="pager"><button data-home class="home-btn">Back to all categories</button>${prev ? `<button data-go="${esc(prev.id)}" data-dir="left">‹ ${esc(prev.name)}</button>` : ''}${next ? `<button class="nx" data-go="${esc(next.id)}" data-dir="right">${esc(next.name)} ›</button>` : ''}</div>
      </div>
    </div></div>`;
  home.hidden = true; cat.hidden = false;
  cat.classList.remove('enter-up', 'enter-from-right', 'enter-from-left'); void cat.offsetWidth;
  cat.classList.add(dir === 'right' ? 'enter-from-right' : dir === 'left' ? 'enter-from-left' : 'enter-up');
  window.scrollTo(0, 0);
  const t = cat.querySelector('.tab[aria-current="true"]'); if (t) t.scrollIntoView({ inline: 'center', block: 'nearest' });
  current = k;
  equalize(cat);
}
function goHome(focusSearch) {
  cat.hidden = true; home.hidden = false; current = -1;
  home.classList.remove('enter-up'); void home.offsetWidth; home.classList.add('enter-up');
  home.querySelectorAll('.tile').forEach(t => { t.style.animation = 'none'; void t.offsetWidth; t.style.animation = ''; });
  window.scrollTo(0, 0);
  if (focusSearch) setTimeout(() => q.focus(), 50);
}
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) {
    const k = CATS.findIndex(c => c.id === go.dataset.go);
    const dir = go.dataset.dir || (current < 0 ? '' : k > current ? 'right' : 'left');
    return show(go.dataset.go, dir);
  }
  if (e.target.closest('[data-search]')) return goHome(true);
  if (e.target.closest('[data-home]')) return goHome();
  const cardEl = e.target.closest('.card');
  if (cardEl) {
    const open = !cardEl.classList.contains('open');
    cardEl.parentElement.querySelectorAll('.card.open').forEach(o => { o.classList.remove('open'); o.querySelector('.name').setAttribute('aria-expanded', 'false'); });
    if (open) { cardEl.classList.add('open'); cardEl.querySelector('.name').setAttribute('aria-expanded', 'true'); }
  }
});
let sx = null, sy = 0;
cat.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
cat.addEventListener('touchend', e => {
  if (sx == null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) { const k = current + (dx < 0 ? 1 : -1); if (CATS[k]) show(CATS[k].id, dx < 0 ? 'right' : 'left'); }
});
</script>

</html>
